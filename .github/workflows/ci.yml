name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install the pinned tooling
        run: pip install -q -r requirements-dev.txt
      # shellcheck is preinstalled on ubuntu-latest; `make lint` downloads the
      # actionlint release the Makefile pins, so the version lives in one place.
      - run: make lint
      - run: make test
